# ==========================================
# NETLIFY.TOML - CONFIGURACIÓN OPTIMIZADA 2025
# Página estática React + Vite + TypeScript
# ==========================================

[build]
  # Directorio donde se ejecutan los comandos
  base = ""
  
  # Comando de build optimizado para Vite
  command = "npm run build"
  
  # Directorio de publicación (Vite output)
  publish = "dist"

[[redirects]]
  # Maneja todas las rutas de React Router
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Aplicar a todas las páginas
  for = "/*"
  
  [headers.values]
    # Previene clickjacking
    X-Frame-Options = "DENY"
    
    # Previene XSS (valor 0 es recomendado en 2025)
    X-XSS-Protection = "0"
    
    # Previene MIME sniffing
    X-Content-Type-Options = "nosniff"
    
    # Política de referrer optimizada
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Content Security Policy optimizada para React + Vite
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';"
    
    # Permissions Policy - Deniega permisos no necesarios
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=()"

[[headers]]
  # CSS, JS, y otros assets estáticos
  for = "/assets/*"
  
  [headers.values]
    # Cache agresivo para assets con hash
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Imágenes optimizadas
  for = "/images/*"
  
  [headers.values]
    # Cache largo para imágenes
    Cache-Control = "public, max-age=31536000"

[[headers]]
  # Fonts optimizados
  for = "/*.woff2"
  
  [headers.values]
    # Cache extra largo para fonts
    Cache-Control = "public, max-age=31536000, immutable"
    
    # CORS para fonts
    Access-Control-Allow-Origin = "*"

# [build.environment]
  # NODE_VERSION = "18"

[dev]
  # Puerto local para development
  port = 5173
  
  # Framework detection automática
  framework = "#auto"

# Configuración específica para production
[context.production]
  # Comando optimizado para production
  command = "npm run build"

# Configuración para deploy previews
[context.deploy-preview]
  # Mismo comando para preview
  command = "npm run build"